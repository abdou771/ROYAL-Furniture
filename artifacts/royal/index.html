<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>البيت الملكي | Royal Furniture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #1a0f05; color: #e8d5a3; font-family: 'Cairo', sans-serif; min-height: 100%; }
      #root { min-height: 100vh; }
      :root {
        --background: 27 50% 10%; --foreground: 40 60% 92%;
        --primary: 43 85% 52%; --primary-foreground: 0 0% 0%;
        --border: 43 60% 20%; --muted: 27 40% 15%; --muted-foreground: 40 30% 65%;
        --card: 27 45% 12%; --card-foreground: 40 60% 92%;
        --ring: 43 85% 52%; --radius: 0.5rem;
        --color-background: hsl(27,50%,10%); --color-foreground: hsl(40,60%,92%);
        --color-primary: hsl(43,85%,52%); --color-primary-foreground: hsl(0,0%,0%);
        --color-border: hsl(43,60%,20%); --color-muted: hsl(27,40%,15%);
        --color-muted-foreground: hsl(40,30%,65%); --color-card: hsl(27,45%,12%);
      }
      #js-loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #1a0f05; color: #d4a017; font-size: 1.5rem; font-family: 'Cairo', sans-serif; z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="js-loading">جاري التحميل...</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
