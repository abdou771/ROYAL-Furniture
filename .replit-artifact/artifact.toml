kind = "web"
previewPath = "/royal/"
title = "Royal Furniture Store"
version = "1.0.0"
id = "artifacts/royal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/royal/" ]
localPort = 22052

[services.development]
run = "pnpm --filter @workspace/royal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/royal", "run", "build" ]
publicDir = "artifacts/royal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22052"
BASE_PATH = "/royal/"
